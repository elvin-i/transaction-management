<!doctype html>
<html lang="zh-cmn-Hans">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="/logo.svg">
    <title>导航控制台</title>
    <style>
      :root {
        --bg: #0b1220;
        --card: rgba(255, 255, 255, 0.06);
        --card2: rgba(255, 255, 255, 0.10);
        --text: rgba(255, 255, 255, 0.92);
        --muted: rgba(255, 255, 255, 0.70);
        --line: rgba(255, 255, 255, 0.12);
        --accent: #2ea043;
        --accent2: #1f6feb;
      }

      html, body {
        height: 100%;
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans", "Liberation Sans", sans-serif;
        color: var(--text);
        background:
          radial-gradient(900px 600px at 15% 10%, rgba(46, 160, 67, 0.28), transparent 60%),
          radial-gradient(900px 600px at 85% 20%, rgba(31, 111, 235, 0.30), transparent 55%),
          radial-gradient(900px 600px at 55% 95%, rgba(255, 215, 0, 0.12), transparent 60%),
          linear-gradient(180deg, #0b1220, #0a0f1c);
      }

      .wrap {
        max-width: 980px;
        padding: 28px 16px 40px;
        margin: 0 auto;
      }

      header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
        padding: 10px 6px 18px;
        border-bottom: 1px solid var(--line);
      }

      h1 {
        font-size: 20px;
        letter-spacing: 0.2px;
        margin: 0;
      }

      .hint {
        font-size: 13px;
        color: var(--muted);
        margin: 0;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
        margin-top: 18px;
      }

      .card {
        position: relative;
        border: 1px solid var(--line);
        background: linear-gradient(180deg, var(--card), rgba(255, 255, 255, 0.03));
        border-radius: 14px;
        padding: 16px 16px 14px;
        overflow: hidden;
      }

      .card::after {
        content: "";
        position: absolute;
        inset: -1px;
        background: radial-gradient(420px 200px at 20% 0%, rgba(255, 255, 255, 0.10), transparent 60%);
        pointer-events: none;
      }

      .title {
        font-size: 15px;
        margin: 0 0 6px;
      }

      .desc {
        font-size: 13px;
        color: var(--muted);
        margin: 0 0 12px;
        line-height: 1.45;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        text-decoration: none;
        color: var(--text);
        background: var(--card2);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 9px 10px;
        font-size: 13px;
        transition: transform 120ms ease, background 120ms ease, border-color 120ms ease;
      }

      .btn:hover {
        transform: translateY(-1px);
        background: rgba(255, 255, 255, 0.14);
        border-color: rgba(255, 255, 255, 0.22);
      }

      .pill {
        display: inline-block;
        font-size: 12px;
        padding: 2px 8px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.06);
        color: var(--muted);
        margin-left: 8px;
      }

      .tag-green { border-color: rgba(46, 160, 67, 0.45); color: rgba(218, 251, 221, 0.88); }
      .tag-blue { border-color: rgba(31, 111, 235, 0.45); color: rgba(213, 231, 255, 0.88); }
      .tag-gold { border-color: rgba(255, 215, 0, 0.35); color: rgba(255, 244, 200, 0.88); }

      @media (max-width: 860px) {
        .grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>导航控制台</h1>
        <p class="hint">如果你用的是 hash 路由，链接需要带 `#/...`。</p>
      </header>

      <div class="grid">
        <section class="card">
          <h2 class="title">支付运营控制台 <span class="pill tag-green">index</span></h2>
          <p class="desc">直接进入交易订单列表页。</p>
          <a class="btn" href="/index.html#/transaction/list">进入交易订单列表</a>
        </section>

        <section class="card">
          <h2 class="title">管理控制台 <span class="pill tag-blue">admin</span></h2>
          <p class="desc">如果你已经构建了多页面，打开 admin.html。</p>
          <a class="btn" href="/admin.html#/home">进入管理控制台</a>
        </section>

        <section class="card">
          <h2 class="title">运维控制台 <span class="pill tag-gold">ops</span></h2>
          <p class="desc">如果你已经构建了多页面，打开 ops.html。</p>
          <a class="btn" href="/ops.html#/home">进入运维控制台</a>
        </section>
      </div>
    </div>
  </body>
</html>
